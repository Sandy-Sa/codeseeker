# DVC pipeline parameters for the agentic coding benchmark.
#
# Cross-machine reproducibility: this file is hashed by DVC, so a change here
# correctly invalidates downstream stages. Heavy model files are referenced by
# name + pinned revision ONLY -- they are never DVC deps and need not exist on a
# machine that only materializes cached results.

# Datasets to run the chain over. MDACE-only for the current vertical slice;
# add `mimic-iii-clean` / `mimic-iv` once their loaders/staging are wired.
datasets:
  - mdace-icd10cm

# Per-dataset staging manifest, iterated by the generic `stage_data`/`prep` DVC
# stages (no dataset name is hard-coded in code or dvc.yaml; swapping datasets is
# a params edit). Per-dataset paths are exposed as scalars because DVC 3.x cannot
# interpolate a whole list into a stage's `deps`/`outs`. For each dataset:
#   raw_dir      -- machine-local source dir. NOT hashed; only read by stage_data,
#                   which never runs on a machine that just materializes cache.
#   copies       -- {src (rel. raw_dir) -> dest (repo-rel)} files stage_data copies.
#                   Hashed as a param so the staged output invalidates correctly.
#   staged_dir   -- DVC-tracked output dir of stage_data (holds the copy dests) and
#                   a `prep` dep. One directory keeps the foreach template fixed.
#   splits_file  -- git-tracked consolidated split file; a `prep` dep.
#   skip_indices -- rows dropped after formatting (was hard-coded in benchmark.py).
staging:
  mdace-icd10cm:
    raw_dir: /scratch/gp50/zs5704/datasets/mdace
    copies:
      - {src: mdace_inpatient_annotations.parquet, dest: data/mdace/processed/mdace_inpatient_annotations.parquet}
      - {src: mdace_notes.parquet,                 dest: data/mdace/processed/mdace_notes.parquet}
    staged_dir: data/mdace/processed
    splits_file: data/splits/mdace_icd10_split.feather
    skip_indices: [27, 179, 260, 327, 379, 394]

# LLM served by vLLM (OpenAI-compatible endpoint on the GPU node).
model:
  provider: vllm
  api_base: http://as2512.internal:8001/v1
  deployment: openai/gpt-oss-20b
  revision: null          # TODO: pin the HF revision SHA for reproducibility
  endpoint: completions
  use_cache: true

sampling:
  temperature: 0.6
  max_tokens: 50000
  seed: 1
  reasoning_effort: low

icd:
  year: 2022

retrieval:
  embed_model: pritamdeka/S-PubMedBert-MS-MARCO
  embed_revision: null    # TODO: pin the HF revision SHA
  embed_query_key: output
  distance: Cosine
  topk: 10
  hnsw:
    m: 32
    ef_construct: 256
  all_codes: false

qdrant:
  # Embedded on-disk index. Overridable at runtime with $QDRANT_LOCAL_PATH
  # (point it at jobfs/scratch on Gadi). Not a DVC dep.
  local_path: ./.qdrant_local

runtime:
  num_workers: 4
  batch_size: 1

agents:
  analyse:
    agent_type: base
    prompt_name: analyse_agent/base_v2
  locate:
    agent_type: split
    prompt_name: locate_agent/locate_few_terms_v1
  verify:
    agent_type: reasoning
    prompt_name: verify_agent/few_per_term_v2
  assign:
    agent_type: reasoning
    prompt_name: assign_agent/reasoning_v7
