# DVC pipeline for the agentic coding benchmark (MDACE vertical slice).
#
# Chain (per dataset): stage_data -> prep -> analyse -> [locate -> verify -> assign]
# Only stage_data/prep/analyse are wired for now; the remaining agents follow the
# same pattern once the slice is verified.
#
# Run one dataset's chain:  dvc repro analyse@mdace-icd10cm
# All stage commands set PYTHONPATH=src:experiments so the `src/` and
# `experiments/` modules resolve identically on every machine.

stages:
  # --- data staging (machine-local raw -> repo-relative processed) ---------
  # Generic over the `staging` manifest in params.yaml; one item per dataset.
  stage_data:
    foreach: ${staging}
    do:
      cmd: PYTHONPATH=src:experiments python experiments/stages/stage_data.py --dataset ${key}
      deps:
        - experiments/stages/stage_data.py
        - experiments/stages/_config.py
      params:
        # raw_dir is intentionally NOT hashed (machine-local); the copy mapping
        # determines the staged output, which DVC also tracks by content hash.
        - staging.${key}.copies
      outs:
        - ${item.staged_dir}

  # --- prep: load + format the HF dataset ---------------------------------
  # Static code deps stay literal (DRY across datasets); the per-dataset staged
  # data dir + split file are interpolated as scalars (DVC 3.x can't interpolate
  # a whole list into deps/outs).
  prep:
    foreach: ${staging}
    do:
      cmd: PYTHONPATH=src:experiments python experiments/stages/prep.py --dataset ${key} --output data/dvc/${key}/prep
      deps:
        - experiments/stages/prep.py
        - experiments/stages/_config.py
        - src/dataloader
        - src/trie
        - ${item.staged_dir}
        - ${item.splits_file}
      params:
        - staging.${key}.skip_indices
        - icd.year
      outs:
        - data/dvc/${key}/prep

  # --- analyse: agent + retrieval -----------------------------------------
  analyse:
    foreach: ${datasets}
    do:
      cmd: PYTHONPATH=src:experiments python experiments/stages/analyse.py --input data/dvc/${item}/prep --output data/dvc/${item}/analyse --metrics-dir data/dvc/${item}/metrics/analyse
      deps:
        - experiments/stages/analyse.py
        - experiments/stages/_config.py
        - experiments/analyse_agent.py
        - src/agents/analyse_agent.py
        - src/retrieval
        - data/dvc/${item}/prep
      params:
        # model.* except api_base: the endpoint URL is machine-local and must
        # NOT invalidate stages, or a cache synced from Gadi (different api_base)
        # would re-run the whole chain. WHICH model is pinned by deployment+revision.
        - model.provider
        - model.deployment
        - model.revision
        - model.endpoint
        - model.use_cache
        - sampling
        - retrieval
        - qdrant.local_path
        - agents.analyse
        - icd.year
      outs:
        - data/dvc/${item}/analyse
        - data/dvc/${item}/metrics/analyse

  # --- locate: agent (no retrieval) ---------------------------------------
  locate:
    foreach: ${datasets}
    do:
      cmd: PYTHONPATH=src:experiments python experiments/stages/locate.py --input data/dvc/${item}/analyse --output data/dvc/${item}/locate --metrics-dir data/dvc/${item}/metrics/locate
      deps:
        - experiments/stages/locate.py
        - experiments/stages/_llm_stage.py
        - experiments/stages/_config.py
        - experiments/locate_agent.py
        - src/agents/locate_agent.py
        - src/trie
        - data/dvc/${item}/analyse
      params:
        # model.* except api_base: the endpoint URL is machine-local and must
        # NOT invalidate stages, or a cache synced from Gadi (different api_base)
        # would re-run the whole chain. WHICH model is pinned by deployment+revision.
        - model.provider
        - model.deployment
        - model.revision
        - model.endpoint
        - model.use_cache
        - sampling
        - agents.locate
        - icd.year
      outs:
        - data/dvc/${item}/locate
        - data/dvc/${item}/metrics/locate

  # --- verify: agent (no retrieval) ---------------------------------------
  verify:
    foreach: ${datasets}
    do:
      cmd: PYTHONPATH=src:experiments python experiments/stages/verify.py --input data/dvc/${item}/locate --output data/dvc/${item}/verify --metrics-dir data/dvc/${item}/metrics/verify
      deps:
        - experiments/stages/verify.py
        - experiments/stages/_llm_stage.py
        - experiments/stages/_config.py
        - experiments/verify_agent.py
        - src/agents/verify_agent.py
        - src/trie
        - data/dvc/${item}/locate
      params:
        # model.* except api_base: the endpoint URL is machine-local and must
        # NOT invalidate stages, or a cache synced from Gadi (different api_base)
        # would re-run the whole chain. WHICH model is pinned by deployment+revision.
        - model.provider
        - model.deployment
        - model.revision
        - model.endpoint
        - model.use_cache
        - sampling
        - agents.verify
        - icd.year
      outs:
        - data/dvc/${item}/verify
        - data/dvc/${item}/metrics/verify

  # --- assign: agent (final stage) ----------------------------------------
  assign:
    foreach: ${datasets}
    do:
      cmd: PYTHONPATH=src:experiments python experiments/stages/assign.py --input data/dvc/${item}/verify --output data/dvc/${item}/assign --metrics-dir data/dvc/${item}/metrics/assign
      deps:
        - experiments/stages/assign.py
        - experiments/stages/_llm_stage.py
        - experiments/stages/_config.py
        - experiments/assign_agent.py
        - src/agents/assign_agent.py
        - src/trie
        - data/dvc/${item}/verify
      params:
        # model.* except api_base: the endpoint URL is machine-local and must
        # NOT invalidate stages, or a cache synced from Gadi (different api_base)
        # would re-run the whole chain. WHICH model is pinned by deployment+revision.
        - model.provider
        - model.deployment
        - model.revision
        - model.endpoint
        - model.use_cache
        - sampling
        - agents.assign
        - icd.year
      outs:
        - data/dvc/${item}/assign
        - data/dvc/${item}/metrics/assign
